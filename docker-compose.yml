services:
  postgres:
    build: ./postgres
    container_name: lab-postgres
    env_file: .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata 
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/custom.conf:ro 
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} && psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1' -q -t -A 2>/dev/null | grep -q '1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - lab

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: lab-pgadmin
    env_file: .env
    ports:
      - "5050:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lab

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: lab-redpanda
    
    command: >
      redpanda start
      --smp 1
      --overprovisioned
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      --advertise-kafka-addr internal://lab-redpanda:9092,external://localhost:19092
      --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      --rpc-addr 0.0.0.0:33145
    ports:
      - "19092:19092" 
      - "18081:18081" 
      - "18082:18082" 
    volumes:
      - redpanda_data_lab:/var/lib/redpanda/data
    networks:
      - lab
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 15s  
      timeout: 5s    
      retries: 5  
      start_period: 20s 

  console:
    image: docker.redpanda.com/redpandadata/console:v2.4.3
    container_name: redpanda-console
    environment:
      KAFKA_BROKERS: "lab-redpanda:9092"
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: "http://lab-redpanda:8081"
    ports:
      - "8080:8080"
    networks:
      - lab

  debezium:
    build: ./debezium
    container_name: cdc-worker
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: lab-redpanda:9092
      GROUP_ID: cdc-group-br
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
    networks:
      - lab
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 30s
      timeout: 5s
      retries: 5

  jupyter:
    build: ./jupyter
    container_name: lab-jupyter
    ports:
      - "8888:8888"
    env_file: .env
    volumes:
      - ./jupyter/notebooks:/home/jovyan/work
      - ./jupyter/data:/home/jovyan/data 
    restart: unless-stopped  
    depends_on:
      postgres:
        condition: service_healthy 
    networks:
      - lab
  
  redis:
    image: redis:7-alpine
    container_name: lab-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis:/data
    networks:
      - lab

volumes:
  pgdata:
  pgadmin:
  redis:
  redpanda_data_lab:

networks:
  lab:
    driver: bridge